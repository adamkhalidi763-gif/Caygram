<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caygram</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b12;color:white}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at top,#3030a0 0,#121225 45%,#08080d 100%)}
.card{max-width:760px;width:100%;padding:55px 25px;border:1px solid #ffffff20;border-radius:30px;background:#ffffff0d;backdrop-filter:blur(12px);box-shadow:0 20px 70px #0008}
.logo{font-size:64px;font-weight:900;letter-spacing:-4px;margin-bottom:8px}
.tag{font-size:20px;color:#c9c9d8;margin-bottom:35px}
.buttons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;text-decoration:none;color:white;font-weight:800;padding:15px 24px;border-radius:14px;background:#ff1744}
a.secondary{background:#ffffff15;border:1px solid #ffffff25}
h2{margin-top:45px;font-size:28px}.links{display:grid;gap:12px;margin-top:18px}
.footer{margin-top:35px;color:#858595;font-size:13px}
</style>
</head>
<body>
<section class="hero">
<div class="card">
<div class="logo">CAYGRAM</div>
<div class="tag">Gaming • Videos • Community</div>
<div class="buttons">
<a href="https://www.youtube.com/@CaygramYT" target="_blank">▶ Watch Caygram</a>
<a class="secondary" href="https://www.youtube.com/@CaygramYT?sub_confirmation=1" target="_blank">Subscribe</a>
</div>
<h2>Welcome to Caygram</h2>
<div class="links">
<a class="secondary" href="https://www.youtube.com/@CaygramYT" target="_blank">🎮 YouTube Channel</a>
<a class="secondary" href="https://www.youtube.com/@CaygramYT/videos" target="_blank">🔥 Latest Videos</a>
</div>
<div class="footer">Official Caygram community page</div>
</div>
</section>
</body>
</html>
